<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイマー</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 描画前にテーマを確定させ、初回のちらつきを防ぐ
    try {
      var saved = localStorage.getItem('timer-theme');
      document.documentElement.dataset.theme =
        saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="theme-switch" id="themeSwitch" role="group" aria-label="テーマ">
    <button class="theme-switch__btn" type="button" data-theme-value="light" aria-label="ライトモード" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.2v2.3M12 19.5v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.2 12h2.3M19.5 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6" />
      </svg>
    </button>
    <button class="theme-switch__btn" type="button" data-theme-value="dark" aria-label="ダークモード" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1z" />
      </svg>
    </button>
  </div>

  <!-- 画面 1: 時間の設定 -->
  <main class="setup-screen" id="setupScreen">
    <h1 class="title">Countdown Timer</h1>

    <form class="setup" id="setup" autocomplete="off">
      <div class="time-input">
        <span class="seg-group">
          <input class="seg" id="hours" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="時">
          <span class="seg-label">時</span>
        </span>
        <span class="colon">:</span>
        <span class="seg-group">
          <input class="seg" id="minutes" type="text" inputmode="numeric" maxlength="2" value="05" aria-label="分">
          <span class="seg-label">分</span>
        </span>
        <span class="colon">:</span>
        <span class="seg-group">
          <input class="seg" id="seconds" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="秒">
          <span class="seg-label">秒</span>
        </span>
      </div>

      <div class="presets" id="presets">
        <button type="button" class="chip" data-add="30">+30秒</button>
        <button type="button" class="chip" data-add="60">+1分</button>
        <button type="button" class="chip" data-add="300">+5分</button>
        <button type="button" class="chip" data-add="600">+10分</button>
        <button type="button" class="chip" data-add="1800">+30分</button>
        <button type="button" class="reset-btn" id="clearBtn">リセット</button>
      </div>
    </form>

    <button class="btn btn--primary btn--large" id="startBtn" type="button">開始</button>

    <label class="notify">
      <input type="checkbox" id="notifyToggle">
      <span>終了時にブラウザ通知を出す</span>
    </label>

    <p class="hint" id="setupHint"><kbd>Enter</kbd> で開始</p>
  </main>

  <!-- 画面 2: カウントダウン -->
  <section class="run-screen" id="runScreen" hidden>
    <output class="display" id="display" aria-live="off">00:00</output>

    <button class="pause-overlay" id="pauseOverlay" type="button" aria-label="再開">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="pause-overlay__disc" cx="50" cy="50" r="47" />
        <path class="pause-overlay__play" d="M38 31 L72 50 L38 69 Z" />
      </svg>
    </button>

    <div class="run-ui" id="runUi">
      <p class="run-status" id="runStatus"></p>
      <div class="run-controls">
        <button class="btn btn--ghost" id="primaryBtn" type="button">一時停止</button>
        <button class="btn btn--ghost" id="backBtn" type="button">設定に戻る</button>
      </div>
      <p class="hint"><kbd>Space</kbd> <span id="runHintAction">一時停止</span>　<kbd>Esc</kbd> 設定に戻る</p>
    </div>

    <div class="bar"><div class="bar__fill" id="progress"></div></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
